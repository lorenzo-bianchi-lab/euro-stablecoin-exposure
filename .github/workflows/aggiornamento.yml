# Aggiornamento settimanale: scarica i dati, ricalcola i moduli, rigenera i dati
# dell'applicazione, la ricompila e la ripubblica.
#
# Se una fonte non risponde, il modulo che la usa fallisce: i suoi risultati restano
# quelli dell'ultima esecuzione riuscita (sono nel repository) e l'applicazione lo
# segnala. Se invece falliscono i test, non viene pubblicato nulla e il sito resta
# com'era.
name: Aggiornamento settimanale

on:
  schedule:
    - cron: "0 6 * * 1"   # ogni lunedì alle 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: aggiornamento
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Dipendenze
        run: |
          pip install -r requirements.txt
          cd web && npm ci

      - name: Aggiornamento dei dati
        id: dati
        run: |
          if python src/run_all.py; then
            echo "esito=completo" >> "$GITHUB_OUTPUT"
          else
            echo "esito=parziale" >> "$GITHUB_OUTPUT"
            echo "::warning::Almeno un modulo è fallito: l'applicazione mostra per quello l'ultimo dato valido e lo segnala."
          fi

      - name: Test dei calcoli e dello strato dati
        run: python -m unittest discover -s tests -v

      - name: Nota metodologica con i numeri aggiornati
        run: cd web && npm run note

      - name: Compilazione dell'applicazione
        run: cd web && npm run build

      - name: Test nel browser
        run: cd web && npm run e2e

      - name: Pubblicazione
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed web/public/data web/public/methodological-note.pdf web/tests/fixtures.json docs SINTESI.md
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo: niente da pubblicare."
          else
            git commit -m "Aggiornamento automatico dei dati ($(date -u +%F), ${{ steps.dati.outputs.esito }})"
            git push
          fi

      - name: Richiesta di ricostruzione del sito
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" \
            || echo "::warning::Ricostruzione del sito non richiesta, verrà fatta al prossimo push."
