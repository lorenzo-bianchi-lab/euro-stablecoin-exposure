# Continuous checks on every push and pull request: formatting and static checks, the
# Python tests, the application tests, the build and the browser tests. Nothing is
# published: the weekly update (weekly-update.yml) is the only workflow that commits.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          cd web && npm ci

      - name: Python formatting and static checks
        run: |
          ruff format --check src tests
          ruff check src tests

      - name: Web formatting, lint and type checks
        run: |
          cd web
          npm run format:check
          npm run lint
          npm run typecheck

      - name: Python tests
        run: python -m unittest discover -s tests -v

      - name: Application tests
        run: cd web && npm test

      - name: Build
        run: cd web && npm run build

      - name: Browser tests
        run: cd web && npm run e2e

      - name: Keep the browser test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            reports/figures/app/browser_test_results.json
            reports/figures/app/report_ab.pdf
          if-no-files-found: ignore
